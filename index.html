<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="/auth/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/auth/spiral-512.png" />
    <link rel="apple-touch-icon" href="/auth/apple-touch-icon.png" />
    <!-- Preload the loader mark so the spinning spiral paints instantly whenever
         a (often brief) loading state appears, instead of losing the fetch race. -->
    <link rel="preload" as="image" href="/auth/spiral.png" />
    <title>Lumid Studio</title>
    <!-- Lumen: stamp the Studio surface BEFORE first paint so the scoped font,
         radius and focus ring (globals.css html[data-surface="studio"]) don't
         flash in after hydration. useStudioSurface() keeps it in sync on SPA
         navigation; keep this prefix list in step with src/hooks/useStudioSurface.ts. -->
    <script>
      (function () {
        var p = location.pathname;
        if (/^\/(studio|code|claude-sessions|explore|auth)(\/|$)/.test(p)) document.documentElement.setAttribute("data-surface", "studio");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
