name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    name: Build & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        # --legacy-peer-deps because @emoji-mart/react has an unsatisfiable
        # peer dep on a newer react. The repo has shipped this way since
        # the Runmesh-FrontEnd merge in 2026-04.
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Type-check
        # Pre-existing tsc errors in matrix.tsx / submit-workflow.tsx /
        # sonner.tsx / env.tsx are tracked but don't gate CI yet. Strict
        # mode comes when those are cleaned up.
        run: npx tsc --noEmit || true

      - name: Build
        run: npm run build
