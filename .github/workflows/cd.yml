name: CD

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  workflow_dispatch:
  repository_dispatch:
    types: [deploy-needed]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/lumid-ui

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          # GITHUB_TOKEN lacks write to the org-owned ghcr package (403); use the
          # org write PAT (repo secret) so the push to ghcr.io/mlsys-io/* succeeds.
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            # CD lanes (see deploy_infra k8s-lift/cd/POLICY.md): a git tag vX.Y.Z emits
            # :vX.Y.Z (via type=ref,event=tag above) -> prod canary lane; a merge to dev
            # emits :nightly-<short-sha> -> nightly lane (Image Updater newest-build on
            # ^nightly-). Confirmed :vX.Y.Z already emitted (v0.4.0 present on ghcr).
            type=sha,prefix=nightly-,enable=${{ github.ref == 'refs/heads/dev' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_BASE=https://lum.id
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
