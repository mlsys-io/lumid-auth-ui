server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The app mounts under /auth/ on the public lum.id origin — the
    # outer lumid_landing_readdy nginx proxies /auth/ here without rewriting
    # the path, so every asset request already has the prefix.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed assets; index.html revalidates so pushes are
    # picked up on next navigation.
    location ~* \.(js|css|woff2?|png|svg|jpg)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Serve build-time precompressed assets with zero per-request CPU: brotli
    # (.br, ~20% smaller) preferred, gzip (.gz, -9) fallback, then on-the-fly
    # gzip for anything not precompressed. brotli_static needs the ngx_brotli
    # module (provided by the fholzer/nginx-brotli base image).
    brotli_static on;
    gzip_static on;
    gzip on;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm font/woff2;
    gzip_min_length 1024;
}
